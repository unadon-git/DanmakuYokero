<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>弾幕 YOKERO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640" aria-label="弾幕回避ゲーム"></canvas>
  <div id="hud">
    <div id="leftHud" class="hudBox">
      <div class="label">LIFE</div><div id="hpRow"></div>
      <div id="status"></div>
    </div>
    <div id="centerHud" class="hudBox">
      <div class="label">WAVE</div><div class="value"><span id="wave">1</span> / 100</div>
      <div id="waveBar"><div id="waveFill"></div></div>
    </div>
    <div id="rightHud" class="hudBox">
      <div class="label">SCORE</div><div class="value" id="score">0</div>
      <div class="label" style="margin-top:5px">EVADE <span id="evade">0</span></div>
    </div>
  </div>
  <button id="pause" aria-label="一時停止">Ⅱ</button>
  <div id="touchControls" aria-label="スマートフォン操作">
    <div id="joystick" aria-label="移動パッド"><div id="stick"></div></div>
    <button id="slowBtn" aria-label="低速移動">SLOW</button>
  </div>
  <div id="screen">
    <div class="card">
      <h1>弾幕<br>YOKERO</h1>
      <div class="subtitle">100 WAVES SURVIVAL</div>
      <div class="rules">
        <div class="rule"><b>移動</b>矢印 / WASD<br><span id="mobileHint">左下の丸パッド</span></div>
        <div class="rule"><b>低速移動</b>Shift / 右下のSLOWボタン</div>
        <div class="rule"><b>支援アイテム</b>弾をかすめ続けると出現</div>
      </div>
      <button id="start">GAME START</button>
      <div class="small">約10分で100ウェーブ。発射地点と弾速は毎ウェーブ変化します。</div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
